name: Build update-nixos-release
"on":
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      - '**.nix'
      - .github/workflows/build-update-nixos-release.yaml
      - flake.lock
      - packages/update-nixos-release/**
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-update-nixos-release:
    runs-on: ubuntu-latest
    steps:
      # Always run this job so that required status checks report on every PR,
      # but only do the work when relevant files changed.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            relevant:
              - '**.nix'
              - .github/workflows/build-update-nixos-release.yaml
              - flake.lock
              - packages/update-nixos-release/**
      - name: Determine whether to run
        id: gate
        run: echo "run=${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: DeterminateSystems/nix-installer-action@v23
        if: steps.gate.outputs.run == 'true'
      - name: Build update-nixos-release
        if: steps.gate.outputs.run == 'true'
        run: nix build '.#update-nixos-release'
